[project]
name = "employee-support-copilot"
version = "1.0.0"
description = "Multi-department agentic RAG copilot for IT and HR support"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "Agentic-RAG-demo"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, B bugbear, UP pyupgrade, I isort
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
    "E501",  # long prompt strings are intentional
    "B008",  # FastAPI dependency idiom: File(...), Form(...), Header(...) in defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
