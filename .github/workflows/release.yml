# Continuous Delivery: publish a versioned Docker image when you push a tag like v1.2.0,
# then (optionally) trigger a deployment.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# Image: ghcr.io/<owner>/<repo>:1.1.0, :1.1, :latest and :sha-<commit>
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GitHub Container Registry with the built-in GITHUB_TOKEN

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: publish
    runs-on: ubuntu-latest
    environment: production   # add required reviewers in repo settings for a manual approval gate
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL secret not set: image published, deployment skipped."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
          echo "Deployment triggered."
